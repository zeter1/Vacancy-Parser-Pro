name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import application modules
        run: python -c "import job_scraper, vacancy_gui, vacancy_parser"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run source self-test
        run: python vacancy_parser.py --self-test

      - name: Build and verify full Windows distribution
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: cmd
        run: build_exe.bat --ci

      - name: Validate packaging metadata
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: pwsh
        run: |
          $required = @(
            'dist/Vacancy Parser Pro.exe',
            'dist/icon.ico',
            'dist/Vacancy-Parser-Pro-portable-x64.zip',
            'dist/build_info.json',
            'dist/SHA256SUMS.txt',
            'build_logs/last_build_summary.json'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing packaging artifact: $path" } }
          $info = Get-Content 'dist/build_info.json' -Raw | ConvertFrom-Json
          if ($info.app -ne 'Vacancy Parser Pro') { throw 'Unexpected app in build_info.json' }
          $summary = Get-Content 'build_logs/last_build_summary.json' -Raw | ConvertFrom-Json
          if ($summary.status -ne 'success') { throw "Packaging summary status: $($summary.status)" }
          Get-FileHash 'dist/Vacancy Parser Pro.exe' -Algorithm SHA256
          Get-FileHash 'dist/Vacancy-Parser-Pro-portable-x64.zip' -Algorithm SHA256

      - name: Upload verified Windows distribution
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        uses: actions/upload-artifact@v4
        with:
          name: Vacancy-Parser-Pro-portable-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
