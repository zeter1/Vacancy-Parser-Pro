name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import application modules
        run: python -c "import job_scraper, vacancy_gui, vacancy_parser"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run source self-test
        run: python vacancy_parser.py --self-test

      - name: Build and verify full Windows distribution
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: cmd
        run: build_exe.bat --ci

      - name: Validate packaging metadata
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: pwsh
        run: |
          $required = @(
            'dist/Vacancy Parser Pro.exe',
            'dist/icon.ico',
            'dist/Vacancy-Parser-Pro-portable-x64.zip',
            'dist/build_info.json',
            'dist/SHA256SUMS.txt',
            'build_logs/last_build_summary.json'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing packaging artifact: $path" } }
          $info = Get-Content 'dist/build_info.json' -Raw | ConvertFrom-Json
          if ($info.app -ne 'Vacancy Parser Pro') { throw 'Unexpected app in build_info.json' }
          $summary = Get-Content 'build_logs/last_build_summary.json' -Raw | ConvertFrom-Json
          if ($summary.status -ne 'success') { throw "Packaging summary status: $($summary.status)" }
          Get-FileHash 'dist/Vacancy Parser Pro.exe' -Algorithm SHA256
          Get-FileHash 'dist/Vacancy-Parser-Pro-portable-x64.zip' -Algorithm SHA256

      - name: Upload verified Windows distribution
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        uses: actions/upload-artifact@v4
        with:
          name: Vacancy-Parser-Pro-portable-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Require fresh Russian release notes on package pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Fxq RELEASE_NOTES_RU.md || {
            echo "RELEASE_NOTES_RU.md must be updated in the same [package] commit."
            exit 1
          }

      - name: Download exact distribution built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Vacancy-Parser-Pro-portable-x64
          path: release

      - name: Publish GitHub Release with Russian notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="build-$short_sha"
          title="Vacancy Parser Pro — Windows-сборка $short_sha"
          exe="release/Vacancy Parser Pro.exe"
          zip="release/Vacancy-Parser-Pro-portable-x64.zip"
          sums="release/SHA256SUMS.txt"
          test -f "$exe" && test -f "$zip" && test -f "$sums"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file RELEASE_NOTES_RU.md
            gh release upload "$tag" "$exe" "$zip" "$sums" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$exe" "$zip" "$sums" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" \
              --notes-file RELEASE_NOTES_RU.md --prerelease
          fi
