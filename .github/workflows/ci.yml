name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import application modules
        run: python -c "import job_scraper, vacancy_gui, vacancy_parser"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run source self-test
        run: python vacancy_parser.py --self-test

      - name: Build and smoke-test packaged EXE
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: cmd
        run: build_exe.bat --ci

      - name: Verify packaged files
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\Vacancy Parser Pro.exe')) { throw 'EXE was not created' }
          if (-not (Test-Path 'dist\icon.ico')) { throw 'Runtime icon was not copied next to EXE' }
          Get-Item 'dist\Vacancy Parser Pro.exe','dist\icon.ico' | Format-Table Name,Length,LastWriteTime
