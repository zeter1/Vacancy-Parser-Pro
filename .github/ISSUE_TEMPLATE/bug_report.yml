name: Сообщить об ошибке
description: Сообщение о проблеме Vacancy Parser Pro
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Для проблем парсинга особенно важны источник, параметры поиска и диагностическая сессия.
        Не публикуйте токены, cookie или другие секретные данные.

  - type: input
    id: version
    attributes:
      label: Версия/ревизия программы
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows
      placeholder: "например: Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Источник вакансий
      placeholder: "например: Rabota.by / HH.ru / GSZ.gov.by"

  - type: textarea
    id: query
    attributes:
      label: Параметры поиска
      description: Профессия, город, зарплата, опыт, формат работы и период публикации.

  - type: textarea
    id: problem
    attributes:
      label: Что произошло
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика поисковой сессии
      description: Приложите безопасную сводку из папки «Логи проблем». Не публикуйте секреты, cookie или OAuth-токены.

  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я проверил проблему на текущей версии проекта.
          required: true
        - label: Я проверил, что приложенные материалы не содержат секретов или персональных данных.
          required: true
